<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Devices</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .nav { background: #333; padding: 10px; margin: -20px -20px 20px -20px; }
        .nav a { color: #fff; text-decoration: none; padding: 10px 15px; display: inline-block; }
        .nav a:hover { background: #555; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f0f0f0; }
        .btn { display: inline-block; padding: 8px 16px; text-decoration: none; border-radius: 4px; }
        .btn-primary { background: #0066cc; color: #fff; }
        .btn-primary:hover { background: #0052a3; }
        .status-available { color: green; font-weight: bold; }
        .status-borrowed { color: orange; font-weight: bold; }
        .status-maintenance { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Dashboard</a>
        <a href="/devices">Devices</a>
        <a href="/employees">Employees</a>
        <a href="/borrowings">Borrowings</a>
        <a href="/maintenance">Maintenance</a>
    </div>
    <h1>Devices</h1>
    <a href="/devices/create" class="btn btn-primary">Add Device</a>
    <br><br>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Device Name</th>
                <th>Serial Number</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="device : ${devices}">
                <td th:text="${device.id}">1</td>
                <td th:text="${device.deviceName}">Laptop</td>
                <td th:text="${device.serialNumber}">SN-001</td>
                <td>
                    <span th:text="${device.status}"
                          th:classappend="${device.status == 'AVAILABLE'} ? 'status-available' :
                                         (${device.status == 'BORROWED'} ? 'status-borrowed' : 'status-maintenance')">AVAILABLE</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(devices)}">
                <td colspan="4" style="text-align:center;color:#999;">No devices registered yet.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
