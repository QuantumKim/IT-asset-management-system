<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log Maintenance</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .nav { background: #333; padding: 10px; margin: -20px -20px 20px -20px; }
        .nav a { color: #fff; text-decoration: none; padding: 10px 15px; display: inline-block; }
        .nav a:hover { background: #555; }
        form { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; }
        label { display: block; margin: 10px 0 5px; color: #333; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #0066cc; color: #fff; }
        .btn-primary:hover { background: #0052a3; }
        .btn-secondary { background: #ccc; color: #333; text-decoration: none; display: inline-block; padding: 8px 16px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Dashboard</a>
        <a href="/devices">Devices</a>
        <a href="/employees">Employees</a>
        <a href="/borrowings">Borrowings</a>
        <a href="/maintenance">Maintenance</a>
    </div>
    <h1>Log Maintenance</h1>
    <form th:action="@{/maintenance/save}" th:object="${maintenance}" method="post">
        <label>Device Name</label>
        <input type="text" th:field="*{deviceName}" required>
        <label>Issue Description</label>
        <textarea th:field="*{issueDescription}" rows="3" required></textarea>
        <label>Status</label>
        <input type="text" th:field="*{repairStatus}" value="In Progress" required>
        <br><br>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/maintenance" class="btn btn-secondary">Cancel</a>
    </form>
</body>
</html>
